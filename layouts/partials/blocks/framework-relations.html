{{/* layouts/partials/blocks/framework-relations.html */}}
<section class="relations-section">
  <div class="relations-inner">

    <div class="relations-header">
      <div class="relations-header-text">
        <span class="eyebrow">{{ .Params.relations_eyebrow }}</span>
        <h2>{{ .Params.relations_title }}</h2>
        <p>{{ .Params.relations_lead }}</p>
      </div>
      <div class="relations-header-image">
        <img src="/assets/layer_analysis.png" alt="Four-layer cross-section model">
      </div>
    </div>

    <div class="relations-grid">
      {{ range .Params.relation_cards }}
      <div class="relation-card reveal">
        <div class="relation-layers">
          {{ range .layers }}
          <div class="rl {{ . }}"></div>
          {{ end }}
        </div>
        <h3>{{ .title }}</h3>
        <p>{{ .body }}</p>
      </div>
      {{ end }}
    </div>

  </div>
</section>
