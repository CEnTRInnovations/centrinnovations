<section class="hero">
  <div class="hero-inner hero-inner--centered">
    <div class="hero-text hero-text--centered">
      <h1>{{ .headline }}</h1>
      <p class="lead">{{ .lead | safeHTML }}</p>
      <div class="actions actions--centered">
        <a href="{{ .primary_link }}" class="button primary">{{ .primary_text }}</a>
        <a href="{{ .secondary_link }}" class="button secondary">{{ .secondary_text }}</a>
      </div>
    </div>
    <blockquote class="hero-quote hero-quote--inline">
      <p>{{ .quote }}</p>
    </blockquote>
    {{ if .image }}
    <img src="{{ .image }}" alt="" class="hero-ecosystem" />
    {{ end }}
  </div>
</section>
