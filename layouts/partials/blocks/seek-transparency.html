{{/* blocks/seek-transparency.html */}}
<section class="seek-transparency">
  <div class="section-inner">

    <div class="section-sidebar reveal">
      <span class="eyebrow">{{ $.Params.transparency_eyebrow }}</span>
      <h2>{{ $.Params.transparency_title }}</h2>
      <div class="sidebar-stripe seek-stripe"></div>
      <p class="sidebar-body">{{ $.Params.transparency_sidebar_1 }}</p>
      <p class="sidebar-body">{{ $.Params.transparency_sidebar_2 }}</p>
    </div>

    <div class="component-content reveal">
      <div class="seek-quote">
        <p>{{ $.Params.transparency_quote }}</p>
      </div>
      <img
        src="/assets/engagement-profile.png"
        alt="Sample engagement profile showing scores across five classification dimensions: Partnership and Power 0.82, Community Voice 0.65, Process and Methods 0.41, Outcomes and Impacts 0.78, Sustainability 0.91. Composite score: 0.71."
        style="width: 100%; height: auto; display: block; border-radius: 6px;"
      />
    </div>

  </div>
</section>
