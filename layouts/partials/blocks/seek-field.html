{{/* layouts/partials/blocks/seek-field.html */}}
<section class="seek-field">
  <div class="section-inner">

    <div class="section-sidebar reveal">
      <span class="eyebrow">{{ .Params.field_eyebrow }}</span>
      <h2>{{ .Params.field_title }}</h2>
      <div class="sidebar-stripe seek-stripe"></div>
      <p class="sidebar-body">{{ .Params.field_sidebar_1 }}</p>
      <p class="sidebar-body">{{ .Params.field_sidebar_2 }}</p>
    </div>

    <div class="field-content reveal">
      <div class="seek-quote">
        <p>{{ .Params.field_quote }}</p>
      </div>
      <div class="seek-system-links">
        <div class="system-chain">
          <div class="chain-item chain-seek">
            <strong>CEnTR*SEEK</strong>
            <span>Identifies engagement</span>
          </div>
          <div class="chain-arrow">→</div>
          <div class="chain-item chain-map">
            <strong>CEnTR*MAP</strong>
            <span>Maps assets</span>
          </div>
          <div class="chain-arrow">→</div>
          <div class="chain-item chain-impact">
            <strong>CEnTR*IMPACT</strong>
            <span>Measures outcomes</span>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>
