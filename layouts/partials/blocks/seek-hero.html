{{/* layouts/partials/blocks/seek-hero.html */}}
<section class="seek-hero">
  <div class="hero-inner">
    <span class="eyebrow">{{ .Params.hero_eyebrow }}</span>
    <h1>{{ .Params.hero_title | safeHTML }}</h1>
    <p class="hero-lead">{{ .Params.hero_lead_1 }}</p>
    <p class="hero-lead" style="margin-top:-0.5rem;">{{ .Params.hero_lead_2 }}</p>
    <div class="component-strip">
      {{ range .Params.hero_strip }}
      <a href="#{{ .anchor }}" class="strip-item {{ .class }}">
        {{ .name }}<br><small style="font-size:0.65em;opacity:0.85;">{{ .label }}</small>
      </a>
      {{ end }}
    </div>
  </div>
</section>
