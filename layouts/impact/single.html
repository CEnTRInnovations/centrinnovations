{{/* layouts/impact/single.html */}}
{{ define "scripts" }}
{{ if .Params.mathjax }}{{ partial "mathjax.html" . }}{{ end }}
<script src="{{ "js/impact.js" | relURL }}"></script>
<div class="viz-lightbox" id="viz-lightbox" onclick="closeLightbox()">
  <button class="viz-lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="viz-lightbox-img" src="" alt="">
</div>
<script>
function openLightbox(src) {
  document.getElementById('viz-lightbox-img').src = src;
  document.getElementById('viz-lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('viz-lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeLightbox();
});
</script>
{{ end }}

{{ define "main" }}
  {{ range .Params.blocks }}
    {{ partial (printf "blocks/%s.html" .block) $ }}
  {{ end }}
{{ end }}
