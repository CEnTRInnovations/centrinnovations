{{/* layouts/partials/blocks/wt-hero.html */}}
<section class="page-hero wt-hero">
  <div class="hero-inner">

    <div class="hero-text reveal">
      <span class="eyebrow">{{ .Params.hero_eyebrow }}</span>
      <h1>{{ .Params.hero_title }}</h1>
      <p class="hero-lead">{{ .Params.hero_lead_1 }}</p>
      {{ if .Params.hero_lead_2 }}
      <p class="hero-lead" style="margin-top:-0.5rem;">{{ .Params.hero_lead_2 }}</p>
      {{ end }}
    </div>

    <div class="hero-visual reveal">
      <img
        src="/assets/root_system.png"
        alt="Botanical illustration of a root system"
        class="hero-botanical wt-hero-botanical"
      />
    </div>

  </div>
</section>
